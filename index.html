<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/icons/Sharkie.png">
    <!-- <base href="/Sharkie/"> -->
    <base href="/">
    <title>Sharkie</title>
    <script src="assets/classes/drawable-object.class.js" defer></script>
    <script src="assets/classes/movable-object.class.js" defer></script>
    <script src="assets/classes/character.class.js" defer></script>
    <script src="assets/classes/other/keyboard.class.js" defer></script>
    <script src="assets/classes/enemies/jelly/jelly-green.class.js" defer></script>
    <script src="assets/classes/enemies/jelly/jelly-lila.class.js" defer></script>
    <script src="assets/classes/enemies/jelly/jelly-pink.class.js" defer></script>
    <script src="assets/classes/enemies/jelly/jelly-yellow.class.js" defer></script>
    <script src="assets/classes/enemies/puffer/puffer-green.class.js" defer></script>
    <script src="assets/classes/enemies/puffer/puffer-orange.class.js" defer></script>
    <script src="assets/classes/enemies/puffer/puffer-red.class.js" defer></script>
    <script src="assets/classes/other/coin.class.js" defer></script>
    <script src="assets/classes/other/posion.class.js" defer></script>
    <script src="assets/classes/other/status-bar.class.js" defer></script>
    <script src="assets/classes/other/finall-enemy-sb.class.js" defer></script>
    <script src="assets/classes/other/coins-counter.class.js" defer></script>
    <script src="assets/classes/other/posions-counter.class.js" defer></script>
    <script src="assets/classes/other/sound.class.js" defer></script>
    <script src="assets/classes/world.class.js" defer></script>
    <script src="assets/classes/other/background-object.class.js" defer></script>
    <script src="assets/classes/other/level.class.js" defer></script>
    <script src="assets/classes/other/throwable-object.class.js" defer></script>
    <script src="assets/classes/enemies/final-enemy.class.js" defer></script>
    <script src="assets/levels/level1.js" defer></script>
    <script src="assets/scripts/game.js" defer></script>
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
    <div id="game_screen" class="game_screen">
        <canvas id="canvas" width="720" height="480">
        </canvas>
        <div class="screen_top">
            <img onclick="world.gameRestart()" id="restart_img" class="screen_img"
                src="assets/images/icons/restart.png">
            <img onclick="FullScreenRender()" id="screen_img" class="fullScreen_img"
                src="assets/images/icons/fullscreen.png">
            <img onclick="volumeRender()" id="volume_img" class="screen_img" src="assets/images/icons/volume.png">
            <img onclick="pauseRender()" id="pause_img" class="screen_img" src="assets/images/icons/pause.png">
        </div>
        <div class="screen_bottom">
            <div class="top_bottom_div">
                <button id="button_up" class="btn_top responsive_button"></button>
                <button id="button_bobble" class="btn_bobble responsive_button"></button>
                <button id="button_down" class="btn_bottom responsive_button"></button>
            </div>
            <div class="left_right_div">
                <button id="button_left" class="btn_left responsive_button"></button>
                <button id="button_right" class="btn_right responsive_button"></button>
            </div>
        </div>
        <div class="game_paused" id="game_paused">
            <img onclick="playGameRender()" src="assets/images/icons/paused.png">
            <a href="index.html">
                <img class="menu_img" src="assets/images/6.Botones/Start/5.png" alt="Start">
            </a>
        </div>
        <div class="game_ended" id="game_ended">
            <img id="game_over" class="game_over" src="assets/images/6.Botones/Tittles/Game-Over/Recurso10.png">
            <div class="div_tryagain">
                <img onclick="world.gameRestart()" class="menu_img"
                    src="assets/images/6.Botones/Try again/Recurso 18.png">
                <a href="index.html">
                    <img class="menu_img" src="assets/images/6.Botones/Start/5.png">
                </a>
            </div>
        </div>
    </div>
    <img class="landscape" src="assets/images/turn-to-landscape.gif">
    <div id="game_menu" class="game_menu">
        <img onclick="init()" class="start_img" src="assets/images/6.Botones/Start/4.png">
        <img onclick="init(),FullScreenRender()" class="repolnsive_start" src="assets/images/6.Botones/Start/4.png">
        <img class="keyboard_img" src="assets/images/6.Botones/Instructions 2.png">
        <a href="impressum.html" target="_blank">Impressum</a>
    </div>
</body>
</html>
